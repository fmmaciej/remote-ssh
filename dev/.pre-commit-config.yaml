repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --config=dev/pyproject.toml]
        files: ^scripts/.*\.py$
      - id: ruff-format
        args: [--config=dev/pyproject.toml]
        files: ^scripts/.*\.py$

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.8.0-1
    hooks:
      - id: shfmt
        files: \.sh$

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.sh$
      - id: mypy
        name: mypy
        entry: mypy --config-file dev/pyproject.toml scripts
        language: system
        pass_filenames: false
        files: ^scripts/.*\.py$
      - id: smoke
        name: smoke tests
        entry: just smoke
        language: system
        pass_filenames: false
        files: ^(dev/|lib/|scripts/|shell/|tools/|install\.sh|runme\.sh|justfile)$
