repos:
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.8.0-1
    hooks:
      - id: shfmt
        files: \.sh$

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: bash -lc 'cd dev && uv run ruff check --fix ../scripts check_assets_live.py tests'
        language: system
        pass_filenames: false
        files: ^(scripts/.*\.py|dev/check_assets_live\.py|dev/tests/.*\.py)$
      - id: ruff-format
        name: ruff format
        entry: bash -lc 'cd dev && uv run ruff format ../scripts check_assets_live.py tests'
        language: system
        pass_filenames: false
        files: ^(scripts/.*\.py|dev/check_assets_live\.py|dev/tests/.*\.py)$
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.sh$
      - id: mypy
        name: mypy
        entry: bash -lc 'cd dev && uv run mypy --config-file pyproject.toml ../scripts check_assets_live.py'
        language: system
        pass_filenames: false
        files: ^(scripts/.*\.py|dev/check_assets_live\.py)$
      - id: smoke
        name: smoke tests
        entry: just smoke
        language: system
        pass_filenames: false
        files: ^(dev/|lib/|scripts/|shell/|tools/|install\.sh|runme\.sh|justfile)$
