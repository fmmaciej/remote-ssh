# config.toml

db_path = "~/.local/share/atuin/history.db"
key_path = "~/.local/share/atuin/key"
session_path = "~/.local/share/atuin/session"

auto_sync = true
sync_frequency = "30m"
update_check = false

filter_mode = "global"
search_mode = "fuzzy"

filter_mode_shell_up_key_binding = "directory"
search_mode_shell_up_key_binding = "fuzzy"

inline_height = 20
inline_height_shell_up_key_binding = 12
style = "compact"

max_preview_height = 3
show_help = false
show_preview = true
show_tabs = false

# bezpieczniej i bardziej "edytowalnie" niż natychmiastowe wykonanie
enter_accept = false
exit_mode = "return-original"

[logs]
dir = "~/.local/share/atuin/logs"
enabled = true
level = "warn"
retention = 7
