# config.toml

db_path = "~/.local/share/atuin/history.db"
key_path = "~/.local/share/atuin/key"
session_path = "~/.local/share/atuin/session"

auto_sync = false
update_check = false

filter_mode = "global"
search_mode = "fuzzy"


inline_height = 20
style = "compact"

max_preview_height = 3
show_help = false
show_preview = true
show_tabs = false

# bezpieczniej i bardziej "edytowalnie" niż natychmiastowe wykonanie
enter_accept = false
exit_mode = "return-original"

[logs]
dir = "~/.local/share/atuin/logs"
enabled = true
level = "warn"
retention = 7
