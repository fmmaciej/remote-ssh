# TMUX

# Szybka reakcja ESC (Vim w tmux)
set -s escape-time 0

# rc.sh
set -g default-shell /bin/bash
set -g default-command 'bash --rcfile ~/.local/share/remote-ssh/shell/rc.sh -i'

# Historia
set -g history-limit 50000

# Clipboard (działa tam, gdzie tmux potrafi)
set -g set-clipboard on

# Focus events (vim / nvim / terminale)
set -g focus-events on

# Nie zmieniaj nazw okien automatycznie
set -g allow-rename off
setw -g automatic-rename off

# Mouse (bezpieczne default)
set -g mouse on

# Reload config
bind r source-file ~/.local/share/remote-ssh/dots/tmux.conf \; display-message "tmux.conf reloaded"

# Ruch jak w Vim
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Splity
bind v split-window -v
bind b split-window -h

# Resize pane
bind -r C-h resize-pane -L
bind -r C-j resize-pane -D
bind -r C-k resize-pane -U
bind -r C-l resize-pane -R

# Swap windows
bind -n C-S-Left  swap-window -t -1
bind -n C-S-Right swap-window -t +1

# Sync panes (on/off)
bind -r p setw synchronize-panes

# Respawn current pane
bind q respawn-pane -k

# Copy mode + vi keys
setw -g mode-keys vi
bind [ copy-mode

# Vim-style selection (modern tmux copy-mode API)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Scroll
bind -T copy-mode-vi PageUp send -X page-up
bind -T copy-mode-vi PageDown send -X page-down
bind -T copy-mode-vi C-u send -X halfpage-up
bind -T copy-mode-vi C-d send -X halfpage-down

# Agresywne dopasowanie okna (multi-monitor)
setw -g aggressive-resize on
