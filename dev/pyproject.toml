[project]
name = "remote-ssh-dev"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.19.0",
  "pre-commit>=4.5.0",
  "pytest>=9.0.3",
  "ruff>=0.14.9",
]

[tool.ruff]
target-version = "py313"
line-length = 100

# Repo nie-pythonowe
extend-exclude = [
  "shell/",
  "lib/",
  "tools/",
  "dots/",
]

[tool.ruff.lint]
select = [
  "E",    # podstawowe błędy (pep8)
  "F",    # błędy runtime (undefined name, etc.)
  "I",    # import order
  "B",    # bugbear – realne bugi
  "UP",   # modernizacja składni (py3)
]

ignore = [
  "E501",   # długość linii, format ogarnie
  "B008",   # function call in default args
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"

# Repo skryptowe, nie biblioteka
files = ["scripts"]

ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

# Nie wymagamy pełnych typów
disallow_untyped_defs = false
check_untyped_defs = false

# Mniej szumu
no_implicit_optional = false
strict_optional = true

# Czytelne błędy
pretty = true
show_error_codes = true
